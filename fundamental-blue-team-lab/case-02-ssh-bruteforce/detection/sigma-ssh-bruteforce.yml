title: SSH Brute Force Attempt
id: placeholder-replace-with-real-uuid
status: experimental
description: Detects multiple failed SSH login attempts from the same source within a short time window. Placeholder, adjust thresholds after testing against real auth.log data from the lab.
logsource:
  product: linux
  service: sshd
detection:
  selection:
    logsource: auth.log
    message|contains: "Failed password"
  timeframe: 5m
  condition: selection | count() by src_ip > 10
falsepositives:
  - Legitimate user mistyping password repeatedly
  - Automated health check scripts misconfigured with wrong credentials
level: medium
